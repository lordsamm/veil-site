<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veil — Browse unseen</title>
<meta name="description" content="A private browser with a built-in AI assistant. No trackers. No accounts. Nothing you do leaves your device.">
<meta name="theme-color" content="#0B0A0F">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0B0A0F;
    overflow: hidden;
  }
  iframe {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    display: block;
  }
  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0B0A0F;
    color: #7C6BFF;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .loading.hide { opacity: 0; }
</style>
</head>
<body>
  <div class="loading">LOADING…</div>
  <iframe
    id="frame"
    src="https://veilbrowser.lovable.app"
    title="Veil — Browse unseen"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
  <script>
    const f = document.getElementById('frame');
    const l = document.querySelector('.loading');
    f.addEventListener('load', () => { l.classList.add('hide'); });
  </script>
</body>
</html>
